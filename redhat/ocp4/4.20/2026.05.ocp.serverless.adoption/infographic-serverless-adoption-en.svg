<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1240 1754" role="img" aria-labelledby="title desc">
  <title id="title">OpenShift Serverless Adoption Poster - English</title>
  <desc id="desc">A4 portrait print poster summarizing AWS Lambda to OpenShift Serverless adoption, customer pain points, target architecture, validation data, workflow orchestration, rollout path, and success criteria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.48" stop-color="#101827"/>
      <stop offset="1" stop-color="#24080B"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2B2B" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFB000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9  0 0.25 0 0 0.05  0 0 0.2 0 0.04  0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#FF3B30"/>
    </marker>
    <style>
      text { font-family: "Arial", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .white { fill: #FFFFFF; }
      .muted { fill: #B8C0CC; }
      .red { fill: #FF3B30; }
      .orange { fill: #FFB000; }
      .cyan { fill: #50E3C2; }
      .blue { fill: #60A5FA; }
      .dark { fill: #0B111C; }
      .panel { fill: url(#panel); stroke: rgba(255,255,255,0.22); stroke-width: 1.5; }
      .panelRed { fill: rgba(255,59,48,0.14); stroke: #FF3B30; stroke-width: 2; }
      .panelGold { fill: rgba(255,176,0,0.13); stroke: #FFB000; stroke-width: 2; }
      .panelCyan { fill: rgba(80,227,194,0.12); stroke: #50E3C2; stroke-width: 2; }
      .rule { stroke: #FFFFFF; stroke-opacity: 0.2; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #FF3B30; stroke-width: 5; marker-end: url(#arrow); }
      .kicker { font-size: 24px; font-weight: 800; letter-spacing: 4px; }
      .h1 { font-size: 72px; font-weight: 900; }
      .h1b { font-size: 44px; font-weight: 900; }
      .h2 { font-size: 34px; font-weight: 900; }
      .h3 { font-size: 26px; font-weight: 800; }
      .body { font-size: 23px; font-weight: 500; }
      .small { font-size: 19px; font-weight: 500; }
      .tiny { font-size: 16px; font-weight: 500; }
      .num { font-size: 58px; font-weight: 900; }
    </style>
  </defs>

  <rect width="1240" height="1754" fill="url(#bg)"/>
  <rect width="1240" height="1754" fill="url(#grid)"/>
  <circle cx="1035" cy="185" r="330" fill="#FF2B2B" opacity="0.16" filter="url(#glow)"/>
  <circle cx="160" cy="1510" r="360" fill="#2563EB" opacity="0.14" filter="url(#glow)"/>
  <path d="M0 0H1240V30H0Z" fill="url(#flare)"/>

  <g transform="translate(70 76)">
    <text class="kicker red" x="0" y="0">SERVERLESS ADOPTION / CUSTOMER POSTER</text>
    <text class="h1 white" x="0" y="82">OpenShift Serverless</text>
    <text class="h1b white" x="0" y="144">Unified Multi-Cloud Functions</text>
    <text class="h1b white" x="0" y="196">and Workflows Platform</text>
    <text class="body muted" x="2" y="248">Portable, GitOps-driven serverless platform powered by Knative and SonataFlow.</text>
  </g>

  <g transform="translate(70 340)" filter="url(#softShadow)">
    <rect class="panelRed" x="0" y="0" width="330" height="216" rx="18"/>
    <text class="h3 red" x="26" y="45">Current State</text>
    <text class="body white" x="26" y="86">AWS Lambda + IAM</text>
    <text class="body white" x="26" y="122">API Gateway / EventBridge</text>
    <text class="body muted" x="26" y="164">One toolchain per cloud</text>
    <text class="body muted" x="26" y="196">Pipelines multiply by cloud</text>

    <path class="arrow" d="M360 108 C438 108 438 108 516 108"/>

    <rect class="panelCyan" x="546" y="0" width="594" height="216" rx="18"/>
    <text class="h3 cyan" x="572" y="45">Target State</text>
    <text class="body white" x="572" y="86">One CI/CD pipeline: Tekton / GitOps</text>
    <text class="body white" x="572" y="122">One delivery unit: OCI image + Knative YAML</text>
    <text class="body muted" x="572" y="164">ROSA / ARO / OCP on AliCloud / GCP</text>
    <text class="body muted" x="572" y="196">Cloud differences move to overlays, not app logic</text>
  </g>

  <g transform="translate(70 600)">
    <text class="h2 white" x="0" y="0">End-to-End Validation Data</text>
    <text class="small muted" x="0" y="34">Environment: ROSA HCP 4.20.21 + AWS Lambda Python 3.12, us-east-2, 2026-05-12</text>

    <g transform="translate(0 70)" filter="url(#softShadow)">
      <rect class="panel" x="0" y="0" width="260" height="175" rx="16"/>
      <text class="small muted" x="24" y="34">Cold start latency</text>
      <text class="num red" x="24" y="94">292ms</text>
      <text class="small muted" x="24" y="130">AWS Lambda</text>
      <text class="small white" x="24" y="158">Knative: ~1.67s</text>
    </g>

    <g transform="translate(280 70)" filter="url(#softShadow)">
      <rect class="panel" x="0" y="0" width="260" height="175" rx="16"/>
      <text class="small muted" x="24" y="34">Warm request latency</text>
      <text class="num cyan" x="24" y="94">28ms</text>
      <text class="small muted" x="24" y="130">Knative on ROSA</text>
      <text class="small white" x="24" y="158">Lambda: ~44-55ms</text>
    </g>

    <g transform="translate(560 70)" filter="url(#softShadow)">
      <rect class="panel" x="0" y="0" width="260" height="175" rx="16"/>
      <text class="small muted" x="24" y="34">Scale-to-zero</text>
      <text class="num orange" x="24" y="94">90s</text>
      <text class="small muted" x="24" y="130">Knative configurable</text>
      <text class="small white" x="24" y="158">Lambda: ~15min</text>
    </g>

    <g transform="translate(840 70)" filter="url(#softShadow)">
      <rect class="panel" x="0" y="0" width="300" height="175" rx="16"/>
      <text class="small muted" x="24" y="34">Deployment complexity</text>
      <text class="num red" x="24" y="94">11 -> 1</text>
      <text class="small muted" x="24" y="130">AWS CLI commands to oc apply</text>
      <text class="small white" x="24" y="158">3 services become 1 API</text>
    </g>
  </g>

  <g transform="translate(70 915)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="1100" height="292" rx="22"/>
    <text class="h2 white" x="30" y="58">Target Architecture: Cloud-Neutral Serverless Chain</text>

    <rect x="38" y="105" width="210" height="72" rx="12" fill="#FFFFFF" opacity="0.96"/>
    <text class="h3 dark" x="68" y="151">Git / CI</text>
    <text class="tiny dark" x="68" y="172">Tekton Pipeline</text>

    <path class="arrow" d="M260 141H367"/>

    <rect x="380" y="105" width="250" height="72" rx="12" fill="#FFFFFF" opacity="0.96"/>
    <text class="h3 dark" x="410" y="151">OCI Image</text>
    <text class="tiny dark" x="410" y="172">Knative Service YAML</text>

    <path class="arrow" d="M642 141H746"/>

    <rect x="760" y="75" width="300" height="132" rx="14" fill="#111827" stroke="#50E3C2" stroke-width="2"/>
    <text class="h3 cyan" x="790" y="122">OpenShift</text>
    <text class="body white" x="790" y="158">ROSA / ARO / OCP</text>
    <text class="small muted" x="790" y="188">Knative Serving + Eventing</text>

    <line class="rule" x1="30" y1="232" x2="1070" y2="232"/>
    <text class="body white" x="30" y="267">The delivery model shifts from "N clouds x M functions" to "1 pipeline x M functions".</text>
  </g>

  <g transform="translate(70 1250)">
    <g filter="url(#softShadow)">
      <rect class="panelGold" x="0" y="0" width="540" height="230" rx="18"/>
      <text class="h2 white" x="28" y="55">Cost and Elasticity</text>
      <text class="body white" x="28" y="104">Dedicated serverless machine pool: 0 -> N</text>
      <text class="body white" x="28" y="145">When Knative pods scale to zero, nodes can too</text>
      <text class="body white" x="28" y="186">Spot instances can cut compute by 60-90%</text>
    </g>

    <g transform="translate(584 0)" filter="url(#softShadow)">
      <rect class="panel" x="0" y="0" width="556" height="230" rx="18"/>
      <text class="h2 white" x="28" y="55">Workflow Orchestration</text>
      <text class="body white" x="28" y="104">SonataFlow maps to AWS Step Functions</text>
      <text class="body white" x="28" y="145">CNCF Serverless Workflow open standard</text>
      <text class="body white" x="28" y="186">YAML CRD + GitOps, portable across OCP</text>
    </g>
  </g>

  <g transform="translate(70 1515)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="1100" height="150" rx="18"/>
    <text class="h2 white" x="30" y="52">Recommended 10-Week Migration Path</text>
    <line x1="35" y1="95" x2="1050" y2="95" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="4"/>
    <g>
      <circle cx="55" cy="95" r="13" fill="#FF3B30"/>
      <circle cx="240" cy="95" r="13" fill="#FF3B30"/>
      <circle cx="425" cy="95" r="13" fill="#FFB000"/>
      <circle cx="610" cy="95" r="13" fill="#50E3C2"/>
      <circle cx="795" cy="95" r="13" fill="#60A5FA"/>
      <circle cx="980" cy="95" r="13" fill="#FFFFFF"/>
    </g>
    <text class="tiny white" x="25" y="130">Install Operators</text>
    <text class="tiny white" x="190" y="130">Machine Pool</text>
    <text class="tiny white" x="375" y="130">Lambda Pilot</text>
    <text class="tiny white" x="575" y="130">Unified CI/CD</text>
    <text class="tiny white" x="748" y="130">Event Sources</text>
    <text class="tiny white" x="938" y="130">Multi-Cloud Test</text>
  </g>

  <g transform="translate(70 1698)">
    <text class="small red" x="0" y="0">CUSTOMER VALUE</text>
    <text class="small white" x="178" y="0">Reduce lock-in - unify delivery - preserve serverless elasticity - govern functions and workflows through GitOps</text>
  </g>
</svg>
