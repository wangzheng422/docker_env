<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Connectivity Link Multi-Cluster DNS GLB — Slides</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

/* ── slide area ── */
#viewer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .25s ease}
#viewer img.fade{opacity:0}

/* ── click zones ── */
.zone{position:fixed;top:0;bottom:0;width:25%;z-index:2;cursor:pointer;opacity:0;transition:opacity .15s}
.zone:hover{opacity:1}
#zone-prev{left:0;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent)}
#zone-next{right:0;background:linear-gradient(-90deg,rgba(255,255,255,.06),transparent)}

/* ── bottom bar ── */
#bar{position:fixed;bottom:0;left:0;right:0;height:56px;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;gap:16px;z-index:10;padding:0 12px;backdrop-filter:blur(6px);transform:translateY(100%);opacity:0;transition:transform .3s ease,opacity .3s ease}
#bar.visible{transform:translateY(0);opacity:1}
#bar button{background:none;border:none;color:#ccc;font-size:22px;cursor:pointer;padding:6px 10px;border-radius:4px;transition:background .15s}
#bar button:hover{background:rgba(255,255,255,.12)}
#counter{color:#aaa;font-size:14px;min-width:70px;text-align:center;user-select:none}
#bar button.active{color:#4fc3f7}

/* ── progress bar ── */
#progress{position:fixed;top:0;left:0;height:3px;background:#4fc3f7;z-index:20;transition:width .3s ease}

/* ── thumbnail strip ── */
#thumbs{position:fixed;bottom:56px;left:0;right:0;background:rgba(0,0,0,.9);display:none;overflow-x:auto;white-space:nowrap;padding:10px 8px;z-index:9;-webkit-overflow-scrolling:touch;backdrop-filter:blur(6px)}
#thumbs.open{display:flex;gap:6px;align-items:center}
#thumbs img{height:70px;border-radius:4px;cursor:pointer;opacity:.5;transition:opacity .15s,outline-color .15s;outline:2px solid transparent;flex-shrink:0}
#thumbs img:hover{opacity:.85}
#thumbs img.current{opacity:1;outline-color:#4fc3f7}

/* ── help overlay ── */
#help-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
#help-overlay.open{display:flex}
#help-box{background:#222;border-radius:12px;padding:28px 36px;max-width:420px;color:#ddd;font-size:14px;line-height:1.8}
#help-box h3{color:#fff;margin-bottom:12px;font-size:18px}
#help-box kbd{background:#333;padding:2px 7px;border-radius:3px;font-size:13px;border:1px solid #555}

/* ── fullscreen button (top-right) ── */
#fs-btn{position:fixed;top:12px;right:12px;z-index:15;background:rgba(0,0,0,.5);border:none;color:#ccc;font-size:18px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s,opacity .3s ease;opacity:0}
#fs-btn.visible{opacity:1}
#fs-btn:hover{background:rgba(255,255,255,.15)}

/* ── progress bar auto-hide ── */
#progress{transition:width .3s ease,opacity .3s ease}
#progress.hidden{opacity:0}

/* ── touch feedback ── */
@media(max-width:768px){
  .zone{width:35%}
  #bar{height:48px}
  #thumbs img{height:50px}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="viewer"><img id="slide" alt="slide"/></div>
<div class="zone" id="zone-prev" onclick="go(-1)"></div>
<div class="zone" id="zone-next" onclick="go(1)"></div>
<button id="fs-btn" onclick="toggleFS()" title="Fullscreen">⛶</button>

<div id="bar">
  <button onclick="go(-1)" title="Previous (←)">◀</button>
  <button id="thumb-toggle" onclick="toggleThumbs()" title="Thumbnails (T)">▦</button>
  <span id="counter"></span>
  <button onclick="toggleHelp()" title="Help (?)">?</button>
  <button onclick="go(1)" title="Next (→)">▶</button>
</div>

<div id="thumbs"></div>

<div id="help-overlay" onclick="toggleHelp()">
  <div id="help-box" onclick="event.stopPropagation()">
    <h3>⌨️ Keyboard Shortcuts</h3>
    <kbd>→</kbd> / <kbd>Space</kbd> / <kbd>PageDown</kbd> — Next slide<br/>
    <kbd>←</kbd> / <kbd>Backspace</kbd> / <kbd>PageUp</kbd> — Previous slide<br/>
    <kbd>Home</kbd> — First slide<br/>
    <kbd>End</kbd> — Last slide<br/>
    <kbd>T</kbd> — Toggle thumbnails<br/>
    <kbd>F</kbd> — Toggle fullscreen<br/>
    <kbd>?</kbd> / <kbd>H</kbd> — Toggle this help<br/>
    <kbd>Esc</kbd> — Close overlays<br/>
    <br/>
    🖱️ Click left/right edges to navigate.<br/>
    📱 Swipe left/right on touch devices.
  </div>
</div>

<script>
// ── slide list ──
const TOTAL = 29;
const slides = [];
for (let i = 1; i <= TOTAL; i++) {
  slides.push('slides02/' + String(i).padStart(2, '0') + '.jpeg');
}

let cur = 0;
const img      = document.getElementById('slide');
const counter  = document.getElementById('counter');
const progress = document.getElementById('progress');
const thumbs   = document.getElementById('thumbs');

// ── preload ──
const cache = [];
slides.forEach((src, i) => {
  const im = new Image();
  im.src = src;
  cache[i] = im;
});

function show(idx) {
  if (idx < 0) idx = 0;
  if (idx >= TOTAL) idx = TOTAL - 1;
  if (idx === cur && img.src.endsWith(slides[idx])) return;
  cur = idx;
  img.classList.add('fade');
  setTimeout(() => {
    img.src = slides[cur];
    img.onload = () => img.classList.remove('fade');
    // fallback if cached
    if (cache[cur] && cache[cur].complete) img.classList.remove('fade');
  }, 120);
  counter.textContent = (cur + 1) + ' / ' + TOTAL;
  progress.style.width = ((cur + 1) / TOTAL * 100) + '%';
  // update thumbnail highlight
  thumbs.querySelectorAll('img').forEach((t, i) => {
    t.classList.toggle('current', i === cur);
    if (i === cur) t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
}

function go(delta) { show(cur + delta); }

// ── thumbnails ──
function buildThumbs() {
  slides.forEach((src, i) => {
    const t = document.createElement('img');
    t.src = src;
    t.alt = 'Slide ' + (i + 1);
    t.onclick = () => show(i);
    thumbs.appendChild(t);
  });
}
buildThumbs();

function toggleThumbs() {
  thumbs.classList.toggle('open');
  document.getElementById('thumb-toggle').classList.toggle('active', thumbs.classList.contains('open'));
}

// ── fullscreen ──
function toggleFS() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

// ── help ──
function toggleHelp() {
  document.getElementById('help-overlay').classList.toggle('open');
}

// ── keyboard ──
document.addEventListener('keydown', e => {
  const helpOpen = document.getElementById('help-overlay').classList.contains('open');
  if (e.key === 'Escape') {
    if (helpOpen) toggleHelp();
    else if (thumbs.classList.contains('open')) toggleThumbs();
    return;
  }
  if (helpOpen) return;
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); go(1); hideUI(); break;
    case 'ArrowLeft': case 'Backspace': case 'PageUp': e.preventDefault(); go(-1); hideUI(); break;
    case 'Home': e.preventDefault(); show(0); hideUI(); break;
    case 'End':  e.preventDefault(); show(TOTAL - 1); hideUI(); break;
    case 't': case 'T': toggleThumbs(); break;
    case 'f': case 'F': toggleFS(); break;
    case '?': case 'h': case 'H': toggleHelp(); break;
  }
});

// ── auto-hide UI ──
const bar    = document.getElementById('bar');
const fsBtn  = document.getElementById('fs-btn');
let hideTimer = null;
const HIDE_DELAY = 2500; // ms

function showUI() {
  bar.classList.add('visible');
  fsBtn.classList.add('visible');
  progress.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideUI, HIDE_DELAY);
}

function hideUI() {
  // don't hide if thumbnails or help are open
  if (thumbs.classList.contains('open')) return;
  if (document.getElementById('help-overlay').classList.contains('open')) return;
  bar.classList.remove('visible');
  fsBtn.classList.remove('visible');
  progress.classList.add('hidden');
}

// show UI on mouse movement only (not keyboard or click)
document.addEventListener('mousemove', showUI, { passive: true });

// keep UI visible while hovering bar or thumbs
bar.addEventListener('mouseenter', () => clearTimeout(hideTimer));
bar.addEventListener('mouseleave', () => { hideTimer = setTimeout(hideUI, HIDE_DELAY); });
thumbs.addEventListener('mouseenter', () => clearTimeout(hideTimer));
thumbs.addEventListener('mouseleave', () => { hideTimer = setTimeout(hideUI, HIDE_DELAY); });

// ── touch swipe ──
let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
}, { passive: true });

// ── init ──
show(0);
showUI(); // show bar initially, then auto-hide
</script>
</body>
</html>
