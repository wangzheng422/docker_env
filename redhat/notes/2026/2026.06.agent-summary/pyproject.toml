[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-summary-agent"
version = "0.1.0"
description = "Containerized Pi-style long document summary agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
summary-agent = "pi_summary_agent.cli:main"
summary-benchmark = "pi_summary_agent.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
